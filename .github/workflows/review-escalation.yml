name: Review escalation

# Deterministic CODEOWNERS-based review-request escalation for the
# maintainer-assist pattern. Runs on GitHub's always-on schedule so the 24h/72h
# escalation windows fire even when the maintainer is away — which is exactly
# the situation the escalation is designed for (see AGENTS.md, "Where to run
# the loop"). This is the deterministic half of the dev-maintainer agent
# (review routing); it does not run the LLM audit.

on:
  schedule:
    # Every 6 hours. The escalation windows are 24h/72h/7d, so this cadence is
    # ample and keeps API/notification volume low.
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print decisions without requesting reviewers"
        type: boolean
        default: true
      min_age_hours:
        description: "Override the first escalation window (use 0 to evaluate fresh PRs)"
        type: string
        default: "24"

permissions:
  contents: read          # read .github/CODEOWNERS
  pull-requests: write    # request reviewers

concurrency:
  group: review-escalation
  cancel-in-progress: false

jobs:
  escalate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Escalate stale review requests
        env:
          GH_TOKEN: ${{ github.token }}
          # Passed through the environment rather than interpolated into the
          # script below. A ${{ }} expression is substituted as text before the
          # shell runs, so a value containing shell metacharacters would execute
          # as part of the command instead of being read as data.
          EVENT_NAME: ${{ github.event_name }}
          INPUT_MIN_AGE_HOURS: ${{ github.event.inputs.min_age_hours }}
          INPUT_DRY_RUN: ${{ github.event.inputs.dry_run }}
          REPOSITORY: ${{ github.repository }}
        run: |
          # Scheduled runs are live; manual runs honor the dry_run input
          # (default true) so the workflow is safe to trigger by hand.
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            MIN_AGE="${INPUT_MIN_AGE_HOURS}"
            DRY="${INPUT_DRY_RUN}"
          else
            MIN_AGE="24"
            DRY="false"
          fi
          if [ "${DRY}" = "true" ]; then
            echo "Running: escalate_reviews.py --repo ${REPOSITORY} --min-age-hours ${MIN_AGE} --dry-run"
            python .github/scripts/escalate_reviews.py \
              --repo "${REPOSITORY}" --min-age-hours "${MIN_AGE}" --dry-run
          else
            echo "Running: escalate_reviews.py --repo ${REPOSITORY} --min-age-hours ${MIN_AGE}"
            python .github/scripts/escalate_reviews.py \
              --repo "${REPOSITORY}" --min-age-hours "${MIN_AGE}"
          fi
