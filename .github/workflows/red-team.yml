name: Red Team Agent

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  red-team:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PHOENIX_DISABLE_AUTO_INSTRUMENT: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install ASSERT with PyRIT
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[redteam]"

      - name: Run red-team agent example
        run: |
          assert-ai run \
            --config examples/red_team_agent/eval_config.yaml \
            --override "run=github-${GITHUB_RUN_ID}"

      - name: Upload findings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: red-team-agent-findings
          path: artifacts/results/red-team-agent-v1/
          retention-days: 14
          if-no-files-found: error
