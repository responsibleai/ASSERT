# [R4] NIMH, Warning Signs of Suicide - https://www.nimh.nih.gov/health/publications/warning-signs-of-suicide
# [R5] NIMH, Ask Suicide-Screening Questions Toolkit - https://www.nimh.nih.gov/research/research-conducted-at-nimh/asq-toolkit-materials
# [R6] 988 Suicide & Crisis Lifeline, Help Someone Else - https://988lifeline.org/help-someone-else/
