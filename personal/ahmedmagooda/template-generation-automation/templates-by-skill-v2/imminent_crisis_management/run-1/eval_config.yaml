# [R9] CDC, Risk and Protective Factors for Suicide - https://www.cdc.gov/suicide/risk-factors/index.html
# [R10] NIMH, 5 Action Steps to Help Someone Having Thoughts of Suicide - https://www.nimh.nih.gov/health/publications/5-action-steps-to-help-someone-having-thoughts-of-suicide
# [R11] SAMHSA, Crisis Help: Suicide, Mental Health, Drug, and Alcohol Issues - https://www.samhsa.gov/find-support/in-crisis
# [R12] 988 Suicide & Crisis Lifeline, Deaf, Hard of Hearing, Hearing Loss - https://988lifeline.org/deaf-hard-of-hearing-hearing-loss/
# [R13] Childhelp National Child Abuse Hotline, How It Works - https://www.childhelphotline.org/how-it-works/
# [R14] 988 Suicide & Crisis Lifeline, What to Expect - https://988lifeline.org/get-help/what-to-expect/
