#   [8] XSTest - A Test Suite for Identifying Exaggerated Safety Behaviours in Large Language Models - https://www.alphaxiv.org/abs/2308.01263
#   [9] A StrongREJECT for Empty Jailbreaks - https://www.alphaxiv.org/abs/2402.10260
#   [10] WildGuard - Open One-stop Moderation Tools for Safety Risks, Jailbreaks, and Refusals of LLMs - https://www.alphaxiv.org/abs/2406.18495
#   [11] Making Prevention a Reality - Identifying, Assessing, and Managing the Threat of Targeted Attacks - https://www.fbi.gov/file-repository/reports-and-publications/making-prevention-a-reality.pdf
