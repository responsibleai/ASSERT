#   [15] Behavioral Threat Assessment Units - A Guide for State and Local Law Enforcement to Prevent Targeted Violence - https://www.secretservice.gov/sites/default/files/reports/2024-10/Behavioral-Threat-Assessment-Units-A-Guide-for-State-and-Local-Law-Enforcement-to-Prevent-Targeted-Violence.pdf
#   [16] OpenAI Usage policies - https://openai.com/policies/usage-policies/