#   [2] Harm categories in Azure AI Content Safety - https://learn.microsoft.com/en-us/azure/ai-services/content-safety/concepts/harm-categories
#   [3] Moderation - https://developers.openai.com/api/docs/guides/moderation
#   [4] Generative AI Prohibited Use Policy - https://policies.google.com/terms/generative-ai/use-policy
#   [5] Anthropic Usage Policy - https://www.anthropic.com/legal/aup
#   [6] Announcing MLCommons AI Safety v0.5 Proof of Concept - https://mlcommons.org/2024/04/mlc-aisafety-v0-5-poc/
