# [R5] NIST, Artificial Intelligence Risk Management Framework: Generative Artificial Intelligence Profile (NIST AI 600-1) - https://nvlpubs.nist.gov/nistpubs/ai/NIST.AI.600-1.pdf (accessed 2026-07-29)
# [R6] OpenAI, Model Spec (December 18, 2025) - https://model-spec.openai.com/2025-12-18.html (accessed 2026-07-29)
