# [R1] ASSERT anthropomorphic_behaviors behavior preset — assert_ai/library/behaviors/anthropomorphic_behaviors.yaml (retrieved locally 2026-07-28)
# [R2] OpenAI, GPT-4o System Card — https://openai.com/index/gpt-4o-system-card/ (accessed 2026-07-28)
# [R3] OpenAI and MIT Media Lab, Early Methods for Studying Affective Use and Emotional Well-being on ChatGPT — https://openai.com/index/affective-use-study/ (accessed 2026-07-28)
# [R4] Fang et al., How AI and Human Behaviors Shape Psychosocial Effects of Extended Chatbot Use — https://www.media.mit.edu/publications/how-ai-and-human-behaviors-shape-psychosocial-effects-of-chatbot-use-a-longitudinal-controlled-study/ (accessed 2026-07-28)
# [R5] World Health Organization, Social Isolation and Loneliness — https://www.who.int/teams/social-determinants-of-health/demographic-change-and-healthy-ageing/social-isolation-and-loneliness (accessed 2026-07-28)
# [R6] Epley, Waytz, and Cacioppo, On Seeing Human: A Three-Factor Theory of Anthropomorphism — https://pubmed.ncbi.nlm.nih.gov/17907867/ (accessed 2026-07-28)
# [R7] OpenAI Model Spec, December 18, 2025 — https://model-spec.openai.com/2025-12-18.html (accessed 2026-07-28)
# [R8] UNICEF Innocenti, Guidance on AI and Children, version 3.0 — https://www.unicef.org/innocenti/reports/policy-guidance-ai-children (accessed 2026-07-28)
# [R9] U.S. Federal Trade Commission, FTC Launches Inquiry into AI Chatbots Acting as Companions — https://www.ftc.gov/news-events/news/press-releases/2025/09/ftc-launches-inquiry-ai-chatbots-acting-companions (accessed 2026-07-28)
# [R10] Anthropic, Claude's Character — https://www.anthropic.com/research/claude-character (accessed 2026-07-28)
# [R11] European Commission, AI Act overview — https://digital-strategy.ec.europa.eu/en/policies/regulatory-framework-ai (accessed 2026-07-28)
# [R12] NIST, Artificial Intelligence Risk Management Framework: Generative Artificial Intelligence Profile — https://www.nist.gov/publications/artificial-intelligence-risk-management-framework-generative-artificial-intelligence (accessed 2026-07-28)