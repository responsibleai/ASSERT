#   [18] Internet Matters, Protect children from online grooming - https://www.internetmatters.org/issues/online-grooming/protect-your-child/ (accessed 2026-07-28)
#   [19] OECD, Children in the digital environment: Revised typology of risks - https://www.oecd.org/en/publications/children-in-the-digital-environment_9b8f222e-en.html (accessed 2026-07-28)
#   [20] UNICEF, Children with disabilities - https://www.unicef.org/disabilities (accessed 2026-07-28)
#   [21] US Centers for Disease Control and Prevention, Risk and Protective Factors - https://www.cdc.gov/child-abuse-neglect/risk-factors/index.html (accessed 2026-07-28)
#   [22] WHO, Suicide - https://www.who.int/news-room/fact-sheets/detail/suicide (accessed 2026-07-28)
#   [23] US Centers for Disease Control and Prevention, Preventing Child Abuse and Neglect - https://www.cdc.gov/child-abuse-neglect/prevention/index.html (accessed 2026-07-28)
#   [24] NIST, Artificial Intelligence Risk Management Framework: Generative Artificial Intelligence Profile - https://www.nist.gov/publications/artificial-intelligence-risk-management-framework-generative-artificial-intelligence (accessed 2026-07-28)