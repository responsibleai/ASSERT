#   [8] RAINN, Consent 101: Respect, Boundaries, and Building Trust - https://rainn.org/articles/what-is-consent (accessed 2026-07-29)
#   [9] UK Ministry of Justice, Government crackdown on explicit deepfakes - https://www.gov.uk/government/news/government-crackdown-on-explicit-deepfakes (accessed 2026-07-29)
#   [10] Google, Generative AI Prohibited Use Policy - https://policies.google.com/terms/generative-ai/use-policy (accessed 2026-07-29)
