#   [3] Rottger et al., XSTest: A Test Suite for Identifying Exaggerated Safety Behaviours in Large Language Models - https://arxiv.org/abs/2308.01263 (accessed 2026-07-29)
#   [4] Anthropic, Constitutional Classifiers: Defending against universal jailbreaks - https://www.anthropic.com/research/constitutional-classifiers (accessed 2026-07-29)
#   [5] OpenAI, Model Spec (December 18, 2025) - https://model-spec.openai.com/2025-12-18.html (accessed 2026-07-29)
