# Reviewed ACS policy for the `invented_entry_requirements` risk.
#
# Drafted by `assert-ai acs generate --suite travel-planner-invented-entry-requirements
# --run baseline` and reviewed before commit. The generator proposed three separate
# `output` annotators (grounding / drift-or-omission / later-definitive-after-missing-
# lookup). They are three facets of one semantic judgement over the same policy target
# ($.output), so they were consolidated into a single annotator whose prompt enumerates
# all three failure modes. That keeps one LLM call per outgoing message instead of three.
#
# Gate shape: SEMANTIC. The harm is an assertion inside the assistant's reply composed by
# `itinerary_optimizer`, a node with NO tool access, so pre_tool_call/post_tool_call has
# nothing to intercept. No tools are gated, therefore `tools: {}`.
#
# The annotator name below MUST stay identical in three places:
#   1. `annotators:` key + `intervention_points.output.annotations` key (this file)
#   2. `input.annotations.unsupported_entry_requirement_classifier` (policy/*.rego)
#   3. the `_ENTRY_ANNOTATOR` dispatcher branch in ../../agent_guarded.py
agent_control_specification_version: 0.3.1-beta
metadata:
  name: travel_planner_invented_entry_requirements
extends: []
policies:
  travel_planner_invented_entry_requirements:
    type: rego
    bundle: ./policy
    query: data.agent_control_specification.travel_planner_invented_entry_requirements.verdict
intervention_points:
  output:
    policy_target: $.output
    policy_target_kind: assistant_output
    policy:
      id: travel_planner_invented_entry_requirements
      query: data.agent_control_specification.travel_planner_invented_entry_requirements.output_verdict
    annotations:
      unsupported_entry_requirement_classifier:
        from: $policy_target
annotators:
  unsupported_entry_requirement_classifier:
    type: llm
tools: {}
