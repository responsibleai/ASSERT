agent_control_specification_version: 0.3.1-beta
metadata:
  name: travel_itinerary_provenance_signal
extends: []
policies:
  travel_itinerary_provenance_signal:
    type: rego
    bundle: ./policy
    query: data.agent_control_specification.travel_itinerary_provenance_signal.verdict
intervention_points:
  post_tool_call:
    policy_target: $.tool_result
    policy_target_kind: tool_result
