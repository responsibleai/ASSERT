agent_control_specification_version: 0.3.1-beta
metadata:
  name: bounded_career_assessment_processor_guardrails
extends: []
policies:
  bounded_career_assessment_processor_guardrails:
    type: rego
    bundle: ./policy
    query: data.agent_control_specification.bounded_career_assessment_processor_guardrails.verdict
intervention_points:
  input:
    policy_target: $.input
    policy_target_kind: user_input
    policy:
      id: bounded_career_assessment_processor_guardrails
      query: data.agent_control_specification.bounded_career_assessment_processor_guardrails.input_verdict
    annotations:
      instruction_like_content_detector:
        from: $policy_target
  pre_model_call:
    policy_target: $.model_request
    policy_target_kind: model_request
    policy:
      id: bounded_career_assessment_processor_guardrails
      query: data.agent_control_specification.bounded_career_assessment_processor_guardrails.pre_model_call_verdict
    annotations:
      instruction_like_content_detector:
        from: $policy_target
  post_model_call:
    policy_target: $.model_response
    policy_target_kind: model_response
    policy:
      id: bounded_career_assessment_processor_guardrails
      query: data.agent_control_specification.bounded_career_assessment_processor_guardrails.post_model_call_verdict
    annotations:
      instruction_like_content_detector:
        from: $policy_target
  output:
    policy_target: $.output
    policy_target_kind: assistant_output
    policy:
      id: bounded_career_assessment_processor_guardrails
      query: data.agent_control_specification.bounded_career_assessment_processor_guardrails.output_verdict
    annotations:
      instruction_like_content_detector:
        from: $policy_target
annotators:
  cv_injection_risk_assessor:
    type: llm
  instruction_like_content_detector:
    type: classifier
