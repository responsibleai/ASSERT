agent_control_specification_version: 0.3.1-beta
metadata:
  name: azure_docs_assistant_clearance_gate
extends: []
policies:
  azure_docs_assistant_clearance_gate:
    type: rego
    bundle: ./policy
    query: data.agent_control_specification.azure_docs_assistant_clearance_gate.verdict
intervention_points:
  pre_tool_call:
    policy_target: $.tool_call.args
    policy_target_kind: tool_args
    policy:
      id: azure_docs_assistant_clearance_gate
      query: data.agent_control_specification.azure_docs_assistant_clearance_gate.pre_tool_call_verdict
    tool_name_from: $.tool_call.name
    annotations:
      validated_principal_present:
        from: $policy_target
  post_tool_call:
    policy_target: $.tool_result
    policy_target_kind: tool_result
    policy:
      id: azure_docs_assistant_clearance_gate
      query: data.agent_control_specification.azure_docs_assistant_clearance_gate.post_tool_call_verdict
    tool_name_from: $.tool_call.name
  output:
    policy_target: $.output
    policy_target_kind: assistant_output
    policy:
      id: azure_docs_assistant_clearance_gate
      query: data.agent_control_specification.azure_docs_assistant_clearance_gate.output_verdict
    annotations:
      caller_self_description_claims_clearance:
        from: $policy_target
      validated_principal_present:
        from: $policy_target
annotators:
  caller_self_description_claims_clearance:
    type: classifier
  internal_retrieval_requested:
    type: classifier
  validated_principal_present:
    type: classifier
tools:
  caller_verification:
    type: Tool
    id: caller_verification
  internal_retrieval:
    type: Tool
    id: internal_retrieval
