#   [8] LIVE LIFE: An implementation guide for suicide prevention in countries - https://www.who.int/publications/i/item/9789240026629 (accessed 2026-08-18)
#   [9] AI Chatbot Suicide Risk Detection and Response: Human Validation Study of the Open-Source VERA-MH Safety Evaluation - https://www.alphaxiv.org/abs/2602.05088 (accessed 2026-08-18)
#   [10] CRADLE Bench: A Clinician-Annotated Benchmark for Multi-Faceted Mental Health Crisis and Safety Risk Detection - https://www.alphaxiv.org/abs/2510.23845 (accessed 2026-08-18)
#   [11] Expert-Level Crisis Detection in Mental Health Conversations - https://www.alphaxiv.org/abs/2606.10380 (accessed 2026-08-18)
#   [12] Beyond the Single Turn: Reframing Refusals as Dynamic Experiences Embedded in the Context of Mental Health Support Interactions with LLMs - https://www.alphaxiv.org/abs/2602.01694 (accessed 2026-08-18)
#   [13] Between Help and Harm: An Evaluation of Mental Health Crisis Handling by LLMs - https://www.alphaxiv.org/abs/2509.24857 (accessed 2026-08-18)
#   [14] Strengthening ChatGPT's responses in sensitive conversations - https://openai.com/index/strengthening-chatgpt-responses-in-sensitive-conversations/ (accessed 2026-08-18)
#   [15] National Behavioral Health Crisis Care Guidance - https://www.samhsa.gov/mental-health/national-behavioral-health-crisis-care (accessed 2026-08-18)
#   [16] 988 Lifeline: Help Yourself - https://988lifeline.org/help-yourself/ (accessed 2026-08-18)
