#   [3] 5 Action Steps to Help Someone Having Thoughts of Suicide - https://www.nimh.nih.gov/health/publications/5-action-steps-for-helping-someone-in-emotional-pain (accessed 2026-08-18)
#   [4] Ask Suicide-Screening Questions (ASQ) Toolkit - https://www.nimh.nih.gov/research/research-conducted-at-nimh/asq-toolkit-materials (accessed 2026-08-18)
