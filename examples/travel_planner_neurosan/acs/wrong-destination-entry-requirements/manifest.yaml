# Reviewed ACS policy for the `wrong_destination_entry_requirements` risk
# (examples/travel_planner_neurosan).
#
# Gate shape: SEMANTIC (output annotator), NOT a tool gate.
#
# Why no tool gate. `check_travel_advisories(region=...)` in the shared
# examples/phoenix_auto_trace/_tools.py IGNORES its `region` argument and returns
# a fixed Japan payload with the caller's region label pasted on top. The tool is
# called correctly, with the right argument, and succeeds. There is NO structural
# signature: a `pre_tool_call` gate sees a valid call, and a `post_tool_call`
# fidelity-to-tool-output check PASSES, because the returned `region` field always
# equals the argument that was passed in.
#
# That echo is also a trap. `classify_intent` falls back to
# {Tokyo, Japan, 7, 3000} on JSON parse failure, so when the destination defaults
# the requested region and the advisory region BOTH say "Japan" and a
# region-comparison gate reports agreement on a falsehood. The annotator prompt
# therefore states explicitly that the payload's `region` field is the caller's own
# argument echoed back and is NOT evidence of attribution; the requirements are
# attributable only when the destination actually being planned is Japan.
#
# Therefore: one `output` intervention point, one annotator, `tools: {}`. Nothing
# is gated at pre/post_tool_call, so the "declare BOTH hooks or fail closed to
# deny" rule is vacuously satisfied.
#
# Intervention style: TRANSFORMATIVE toward MARKING, not suppression. For this
# risk marking IS adequate (unlike the budget verdict): a traveller who is told
# "this advisory could not be attributed to your destination -- check the official
# consular source" is not harmed the way a traveller who reads a confident
# Japanese-encephalitis warning for Paris is. Suppressing entry information
# entirely re-creates the harm from the other side (Clarity failure-06, Branch A:
# silence reads as "nothing is required"). The remediation instruction explicitly
# forbids dropping the topic and requires an official-source pointer.
#
# The annotator name MUST stay identical in three places or the rule silently
# never fires:
#   1. `annotators:` key + `intervention_points.output.annotations` key (this file)
#   2. `input.annotations.unattributable_entry_requirement_classifier` (policy/*.rego)
#   3. the `_ENTRY_ANNOTATOR` constant in ../../agent_guarded.py
# examples/travel_planner_neurosan/_verify_gate.py asserts all three match.
agent_control_specification_version: 0.3.1-beta
metadata:
  name: neurosan_wrong_destination_entry_requirements
extends: []
policies:
  neurosan_wrong_destination_entry_requirements:
    type: rego
    bundle: ./policy
    query: data.agent_control_specification.neurosan_wrong_destination_entry_requirements.verdict
intervention_points:
  output:
    policy_target: $.output
    policy_target_kind: assistant_output
    policy:
      id: neurosan_wrong_destination_entry_requirements
      query: data.agent_control_specification.neurosan_wrong_destination_entry_requirements.output_verdict
    annotations:
      unattributable_entry_requirement_classifier:
        from: $policy_target
annotators:
  unattributable_entry_requirement_classifier:
    type: llm
tools: {}
