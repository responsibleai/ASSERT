# Reviewed ACS policy for the `fabricated_budget_verification` risk
# (examples/travel_planner_neurosan).
#
# Gate shape: SEMANTIC (output annotator), NOT a tool gate.
#
# Why no tool gate. The harm is produced by `optimize_itinerary`, which calls
# `validate_budget(flight_cost=850, hotel_cost=770, other_costs=200, budget=budget)`
# with hardcoded literals. The call is well-formed, the arguments are the right
# types, and the tool SUCCEEDS. A `pre_tool_call` gate would have to decide that
# 850/770/200 are "wrong", which requires knowing what the flight/hotel searches
# actually returned -- information that only exists in the accumulated tool log.
# A `post_tool_call` gate sees `{"total": 1820, "within_budget": true}`, which is
# arithmetically correct for the inputs it was given. Neither hook can see the
# harm. The harm only becomes visible in the composed reply, where the number is
# presented to the user as a *verified* budget result.
#
# Therefore: one `output` intervention point, one annotator, `tools: {}`.
# Nothing is gated at pre/post_tool_call, so the "declare BOTH hooks or fail
# closed to deny" rule is vacuously satisfied -- there is no `tools:` entry that
# declares one hook without the other.
#
# The annotator is grounded, not free-floating. The dispatcher in
# ../../agent_guarded.py first runs a DETERMINISTIC reconciliation of the
# validate_budget arguments against the raw flight/hotel tool results captured by
# `agent.run_pipeline`. If every component reconciles (flight price is one of the
# returned fares, hotel cost is a whole number of nights at a returned nightly
# rate, other_costs appears in the returned data) the dispatcher SHORT-CIRCUITS TO
# ALLOW without an LLM call. The LLM half only decides the remaining question:
# does the reply actually assert the unreconciled figure as a verified result?
#
# Intervention style: TRANSFORMATIVE, not deny-and-refuse. A denial triggers
# regenerate-and-re-gate in the guarded agent. Marking is deliberately NOT enough
# here: a reader takes the headline "$1,820, within budget" no matter what caveat
# is bolted on (Clarity failure-06, Branch C "decorative marking"). The remediation
# instruction forbids restating the total/verdict/remaining at all, even hedged.
#
# The annotator name MUST stay identical in three places or the rule silently
# never fires:
#   1. `annotators:` key + `intervention_points.output.annotations` key (this file)
#   2. `input.annotations.unverified_budget_verdict_classifier` (policy/*.rego)
#   3. the `_BUDGET_ANNOTATOR` constant in ../../agent_guarded.py
# examples/travel_planner_neurosan/_verify_gate.py asserts all three match.
agent_control_specification_version: 0.3.1-beta
metadata:
  name: neurosan_fabricated_budget_verification
extends: []
policies:
  neurosan_fabricated_budget_verification:
    type: rego
    bundle: ./policy
    query: data.agent_control_specification.neurosan_fabricated_budget_verification.verdict
intervention_points:
  output:
    policy_target: $.output
    policy_target_kind: assistant_output
    policy:
      id: neurosan_fabricated_budget_verification
      query: data.agent_control_specification.neurosan_fabricated_budget_verification.output_verdict
    annotations:
      unverified_budget_verdict_classifier:
        from: $policy_target
annotators:
  unverified_budget_verdict_classifier:
    type: llm
tools: {}
