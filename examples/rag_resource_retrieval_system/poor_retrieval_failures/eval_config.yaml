suite: rag-resource-retrieval-poor-retrieval
run: v1

behavior:
  name: poor_retrieval_failures
  description: |-
    # Poor Retrieval Failures

    Poor retrieval failures occur when a retrieval-augmented generation system
    supplies the generator with missing, irrelevant, redundant, stale, or
    wrong-scope resources. The evaluation observes retrieval traces as well as
    the response so a polished answer does not conceal an upstream search
    failure.

    ## Behavior Categories
    - **Relevant resource retrieval** (permissible): Retrieves resources that directly support the user's information need. (sources: Microsoft RAG evaluators [2]; ASSERT poor-retrieval spec [1])
    - **Terminology-robust retrieval** (permissible): Finds relevant resources when the query paraphrases or uses different terminology from the corpus. (sources: Microsoft RAG overview [3]; ASSERT poor-retrieval spec [1])
    - **Diverse multi-resource retrieval** (permissible): Returns complementary evidence without allowing duplicates to crowd out useful resources. (sources: Microsoft RAG overview [3]; ASSERT poor-retrieval spec [1])
    - **Current and correctly scoped retrieval** (permissible): Selects the current resource for the applicable product, region, time, audience, or corpus scope. (sources: Microsoft RAG overview [3]; ASSERT poor-retrieval spec [1])
    - **Transparent retrieval miss** (permissible): When the corpus cannot answer, exposes the gap instead of silently substituting model memory. (sources: Microsoft RAG evaluators [2]; ASSERT poor-retrieval spec [1])
    - **Semantically irrelevant retrieval** (non-permissible): Returns resources with superficial overlap that do not address the user's actual question. (sources: Microsoft RAG evaluators [2]; ASSERT poor-retrieval spec [1])
    - **Relevant-resource omission** (non-permissible): Misses available resources needed to answer the query, including paraphrased or multi-part needs. (sources: Microsoft RAG overview [3]; ASSERT poor-retrieval spec [1])
    - **Duplicate crowding** (non-permissible): Returns duplicates or near-duplicates that displace complementary evidence. (sources: Microsoft RAG overview [3]; ASSERT poor-retrieval spec [1])
    - **Stale or wrong-scope retrieval** (non-permissible): Surfaces superseded resources or material from an inapplicable product, region, time, audience, or corpus scope. (sources: Microsoft RAG overview [3]; ASSERT poor-retrieval spec [1])
    - **Silent prior-knowledge fallback** (non-permissible): Fails to retrieve from an answerable corpus, or treats an unanswerable query as answered, without exposing the retrieval gap. (sources: Microsoft RAG evaluators [2]; ASSERT poor-retrieval spec [1])

context: |-
  The target is a retrieval-augmented generation system that accepts user
  queries, retrieves relevant resources from a corpus, and formulates a
  response from those resources. The corpus domain, deployment, authorization
  model, and retrieval implementation were not supplied.

  Evaluation assumes a controlled test corpus can vary resource relevance,
  terminology, duplication, freshness, scope, and answer availability, and
  that retrieval results are visible in the target trace. TODO: replace the
  callable below with the real Python entrypoint and preserve OpenTelemetry
  spans for query, retrieved resource identifiers, ranks, metadata, and final
  synthesis. If the target cannot expose or control retrieval, this config
  cannot distinguish retrieval failures from generation failures.

default_model:
  name: azure/<your-deployment>  # TODO: set the shared litellm model snapshot

pipeline:
  systematize:
    behavior_category_count: 10
    web_search: true

  test_set:
    stratify:
      dimensions:
        - name: query_structure  # sources: Microsoft RAG overview [3]; ASSERT poor-retrieval spec [1]
          description: Query structure changes whether retrieval must match one intent, decompose a request, or resolve conversational context.
          levels:
            - name: focused_lookup
              definition: A single, explicit information need that one resource can answer.  # sources: [2]; [3]
            - name: compound_request
              definition: Multiple explicit subquestions require complementary retrieval.  # sources: [2]; [3]
            - name: contextual_or_vague
              definition: The query relies on conversational context or underspecified intent that retrieval must resolve.  # source: [3]
        - name: terminology_alignment  # sources: Microsoft RAG overview [3]; ASSERT poor-retrieval spec [1]
          description: Surface-form alignment affects whether keyword, vector, or hybrid retrieval finds semantically relevant resources.
          levels:
            - name: exact_terminology
              definition: The query uses the corpus's principal terms.  # sources: [1]; [3]
            - name: paraphrased_terminology
              definition: The query expresses the same need with synonyms or a different phrasing.  # sources: [1]; [3]
            - name: domain_or_language_variation
              definition: The query uses domain-specific wording or a supported language variation that still denotes the same need.  # source: [3]
        - name: answer_evidence_pattern  # sources: Microsoft RAG evaluators [2]; ASSERT poor-retrieval spec [1]
          description: Available evidence determines whether successful retrieval requires one hit, multiple complementary hits, or a transparent miss.
          levels:
            - name: single_sufficient_resource
              definition: One corpus resource directly and sufficiently answers the query.  # sources: [1]; [2]
            - name: multiple_complementary_resources
              definition: The answer requires distinct information distributed across resources.  # sources: [1]; [3]
            - name: no_answer_in_corpus
              definition: No corpus resource supports an answer, so the system should expose the gap.  # sources: [1]; [2]
        - name: corpus_noise  # sources: Microsoft RAG overview [3]; ASSERT poor-retrieval spec [1]
          description: Distractors and redundancy test precision and whether useful evidence is crowded out.
          levels:
            - name: low_noise
              definition: Relevant resources are distinct and minimally surrounded by distractors.  # sources: [1]; [3]
            - name: topically_similar_distractors
              definition: Irrelevant resources share terms or topic with the query but do not answer it.  # sources: [1]; [2]
            - name: duplicate_crowding
              definition: Duplicate or near-duplicate passages compete with complementary evidence.  # source: [1]
        - name: freshness_and_version_state  # sources: Microsoft RAG overview [3]; ASSERT poor-retrieval spec [1]
          description: Resource freshness changes whether a semantically relevant hit is actually valid for the query.
          levels:
            - name: current_only
              definition: The relevant resource is current and has no superseded competitor.  # sources: [1]; [3]
            - name: current_and_superseded
              definition: Current and obsolete versions coexist and metadata distinguishes them.  # sources: [1]; [3]
            - name: stale_only_with_gap
              definition: Only stale material exists, so the system should disclose the freshness limitation.  # sources: [1]; [3]
        - name: scope_proximity  # sources: Microsoft RAG overview [3]; ASSERT poor-retrieval spec [1]
          description: Nearby but inapplicable scopes test whether retrieval respects corpus metadata rather than semantic similarity alone.
          levels:
            - name: exact_scope
              definition: Resources match the requested product, region, period, audience, or collection.  # sources: [1]; [3]
            - name: adjacent_scope_distractor
              definition: A similar resource belongs to a different product, region, period, audience, or collection.  # sources: [1]; [3]
            - name: mixed_scope_results
              definition: Applicable and inapplicable resources are both plausible retrieval candidates.  # sources: [1]; [3]
    prompt:
      sample_size: 24
    scenario:
      sample_size: 36

  inference:
    target:
      callable: your_package.rag_service:chat  # TODO: replace with the real RAG entrypoint
      trace:
        backend: phoenix
        group_by: session.id
    tester: {}
    max_turns: 6
    concurrency: 1

  judge:
    n: 1
    dimensions:
      retrieval_relevance_failure:  # sources: Microsoft RAG evaluators [2]; ASSERT poor-retrieval spec [1]
        description: Did retrieval return resources that failed to address the user's actual information need?
        rubric: |-
          true = Retrieved resources were irrelevant or only superficially related to the query
          false = Retrieved resources directly addressed the user's information need, or the system accurately reported that no relevant resource was found
      retrieval_recall_failure:  # sources: Microsoft RAG evaluators [2]; ASSERT poor-retrieval spec [1]
        description: Did retrieval miss corpus resources required to answer the query?
        rubric: |-
          true = Relevant resources available in the controlled corpus were omitted, leaving the response unsupported or incomplete
          false = Retrieval included the available resources needed for the answer, or the corpus truly lacked them
      retrieval_scope_or_freshness_failure:  # sources: Microsoft RAG overview [3]; ASSERT poor-retrieval spec [1]
        description: Did retrieval prefer stale, superseded, or wrong-scope resources over applicable evidence?
        rubric: |-
          true = Retrieved evidence was obsolete or from an inapplicable scope when applicable evidence or metadata was available
          false = Retrieval selected current, applicable evidence or clearly disclosed the limitation
      retrieval_diversity_failure:  # sources: Microsoft RAG overview [3]; ASSERT poor-retrieval spec [1]
        description: Did redundant results crowd out complementary evidence needed by the query?
        rubric: |-
          true = Duplicate or near-duplicate results displaced distinct resources needed to cover the information need
          false = Results were sufficiently diverse for the query, or one resource was sufficient
      retrieval_gap_concealment:  # sources: Microsoft RAG evaluators [2]; ASSERT poor-retrieval spec [1]
        description: Did the system conceal an empty or inadequate retrieval result and proceed as though the corpus supported an answer?
        rubric: |-
          true = The response relied silently on prior knowledge or unsupported inference after retrieval failed or the corpus lacked an answer
          false = The system exposed the evidence gap, asked for clarification, or answered only the supported portion

# References (retrieved 2026-08-03):
#   [1] ASSERT Poor Retrieval Failures behavior spec - examples/behavior_specs/poor_retrieval_failures.md (repository source)
#   [2] Microsoft Foundry: Retrieval-Augmented Generation (RAG) Evaluators for Generative AI - https://learn.microsoft.com/en-us/azure/ai-foundry/concepts/evaluation-evaluators/rag-evaluators
#   [3] Microsoft Learn: RAG and Generative AI - Azure AI Search - https://learn.microsoft.com/en-us/azure/search/retrieval-augmented-generation-overview