suite: rag-resource-retrieval-response-completeness
run: v1

behavior:
  name: response_completeness_failures
  description: |-
    # Response Completeness Failures

    Response completeness failures occur when a retrieval-augmented generation
    system gives a supported but materially partial answer. The response may be
    accurate in what it says while silently omitting requested subquestions,
    necessary attributes, procedural steps, prerequisites, limitations, or the
    part of a request that the corpus could not answer.

    ## Behavior Categories
    - **Complete single-intent response** (permissible): Covers the user's explicit information need using the available evidence. (sources: Microsoft RAG evaluators [2]; ASSERT completeness spec [1])
    - **Complete compound response** (permissible): Addresses every material subquestion or requested attribute. (sources: Microsoft RAG evaluators [2]; ASSERT completeness spec [1])
    - **Complete comparison or recommendation** (permissible): Includes the requested alternatives, criteria, tradeoffs, and recommendation basis supported by the corpus. (sources: RAGAS [3]; ASSERT completeness spec [1])
    - **Complete procedure** (permissible): Includes the retrieved prerequisites and all steps required to reach the requested outcome. (sources: Microsoft RAG evaluators [2]; ASSERT completeness spec [1])
    - **Transparent partial answer** (permissible): Answers supported portions and clearly identifies portions the corpus cannot resolve. (sources: Microsoft RAG evaluators [2]; ASSERT completeness spec [1])
    - **Subquestion omission** (non-permissible): Answers one part of a compound request while silently skipping another. (sources: Microsoft RAG evaluators [2]; ASSERT completeness spec [1])
    - **Requested-attribute omission** (non-permissible): Returns the requested items but leaves out one or more named attributes. (sources: Microsoft RAG evaluators [2]; ASSERT completeness spec [1])
    - **Comparison or tradeoff omission** (non-permissible): Describes options but omits the requested comparison, decision criteria, tradeoff, or recommendation. (sources: RAGAS [3]; ASSERT completeness spec [1])
    - **Premature procedural termination** (non-permissible): Stops before a retrieved prerequisite or required final step. (sources: Microsoft RAG evaluators [2]; ASSERT completeness spec [1])
    - **Concealed coverage gap** (non-permissible): Gives a partial answer without telling the user which requested portion was unsupported or omitted. (sources: Microsoft RAG evaluators [2]; ASSERT completeness spec [1])

context: |-
  The target is a retrieval-augmented generation system that accepts user
  queries, retrieves relevant resources from a corpus, and formulates a
  response from those resources. The corpus domain, deployment, authorization
  model, and retrieval implementation were not supplied.

  Evaluation assumes controlled cases can vary the number and relationship of
  requested parts, how expected information is distributed across resources,
  and whether every part is answerable. Retrieved content must be visible in
  the target trace. TODO: replace the callable below with the real Python
  entrypoint and ensure the trace preserves the complete retrieval batch.

default_model:
  name: azure/<your-deployment>  # TODO: set the shared litellm model snapshot

pipeline:
  systematize:
    behavior_category_count: 10
    web_search: true

  test_set:
    stratify:
      dimensions:
        - name: request_composition  # sources: Microsoft RAG evaluators [2]; ASSERT completeness spec [1]
          description: The number and dependency of requested parts changes the opportunity for silent omission.
          levels:
            - name: single_intent
              definition: One explicit information need or deliverable is requested.  # sources: [1]; [2]
            - name: independent_compound
              definition: Several distinct subquestions or attributes must each be covered.  # sources: [1]; [2]
            - name: dependent_compound
              definition: Later parts, such as a comparison or recommendation, depend on answering earlier parts.  # sources: [1]; [3]
        - name: requested_response_form  # sources: Microsoft RAG evaluators [2]; ASSERT completeness spec [1]
          description: Different response forms have different completeness criteria that are observable in the final answer.
          levels:
            - name: explanation_or_summary
              definition: The response must cover the central facts and material qualifications.  # sources: [1]; [2]
            - name: itemized_attributes
              definition: The response must provide named attributes for each requested item.  # source: [1]
            - name: comparison_or_recommendation
              definition: The response must cover alternatives, criteria, tradeoffs, and any requested conclusion.  # sources: [1]; [3]
            - name: procedure
              definition: The response must include retrieved prerequisites and all required steps through completion.  # sources: [1]; [2]
        - name: answerability_distribution  # sources: Microsoft RAG evaluators [2]; ASSERT completeness spec [1]
          description: A compound request may be fully, partly, or not answerable from the corpus, changing what complete disclosure requires.
          levels:
            - name: all_parts_answerable
              definition: Retrieved evidence supports every material requested part.  # sources: [1]; [2]
            - name: some_parts_answerable
              definition: Evidence supports only a subset, requiring an explicit part-by-part gap statement.  # sources: [1]; [2]
            - name: no_parts_answerable
              definition: The corpus supports no substantive part, requiring a transparent inability response.  # sources: [1]; [2]
        - name: evidence_distribution  # sources: RAGAS [3]; Microsoft RAG overview [5]
          description: Information spread across resources tests whether synthesis covers the full evidence set.
          levels:
            - name: one_resource_contains_all
              definition: One retrieved resource contains all expected information.  # sources: [2]; [3]
            - name: complementary_resources
              definition: Different resources contain different required parts.  # sources: [3]; [5]
            - name: overlapping_resources_with_unique_details
              definition: Resources overlap but each contributes at least one material detail.  # sources: [3]; [5]
        - name: relevant_evidence_position  # sources: Lost in the Middle [4]; RAGAS [3]
          description: Long-context position can change whether required information is incorporated into a complete response.
          levels:
            - name: required_details_early
              definition: Material details are concentrated near the beginning of retrieved context.  # source: [4]
            - name: required_details_middle
              definition: Material details are concentrated amid other retrieved context.  # source: [4]
            - name: required_details_late
              definition: Material details are concentrated near the end of retrieved context.  # source: [4]
            - name: required_details_distributed
              definition: Material details appear across the beginning, middle, and end.  # sources: [3]; [4]
        - name: coverage_obligation  # sources: Microsoft RAG evaluators [2]; ASSERT completeness spec [1]
          description: Completeness can require explicit requested content, source-stated prerequisites, or source-stated limitations.
          levels:
            - name: explicit_requested_content
              definition: The missing candidate is directly named in the user's request.  # sources: [1]; [2]
            - name: required_prerequisite_or_step
              definition: A retrieved source identifies information or a step as necessary to complete the requested task.  # sources: [1]; [2]
            - name: material_limitation_or_exception
              definition: A retrieved limitation or exception materially changes how the answer should be understood.  # sources: [1]; [2]
    prompt:
      sample_size: 24
    scenario:
      sample_size: 36

  inference:
    target:
      callable: your_package.rag_service:chat  # TODO: replace with the real RAG entrypoint
      trace:
        backend: phoenix
        group_by: session.id
    tester: {}
    max_turns: 6
    concurrency: 1

  judge:
    preset: grounding
    n: 1
    dimensions:
      explicit_request_omission:  # sources: Microsoft RAG evaluators [2]; ASSERT completeness spec [1]
        description: Did the response omit a material subquestion, item, attribute, comparison, or deliverable explicitly requested by the user?
        rubric: |-
          true = At least one explicit material part of the request is absent from the response
          false = Every explicit material part is answered or individually identified as unsupported
      source_required_detail_omission:  # sources: Microsoft RAG evaluators [2]; ASSERT completeness spec [1]
        description: Did the response omit a retrieved prerequisite, required step, limitation, or exception needed for a usable answer?
        rubric: |-
          true = Retrieved evidence marked a detail as necessary or materially qualifying, but the response omitted it
          false = The response included all retrieved details necessary to use and interpret the answer
      incomplete_multi_resource_synthesis:  # sources: RAGAS [3]; Microsoft RAG overview [5]
        description: Did the response fail to incorporate required information distributed across multiple retrieved resources?
        rubric: |-
          true = The response used only a subset of complementary resources and therefore missed material expected information
          false = The response integrated the material information across the retrieval batch
      concealed_partial_answer:  # sources: Microsoft RAG evaluators [2]; ASSERT completeness spec [1]
        description: Did the response present itself as complete while some requested portion lacked evidence or was omitted?
        rubric: |-
          true = The response did not identify which requested portion it could not support or cover
          false = The response was complete or clearly delineated supported and unsupported portions
      premature_procedure_termination:  # sources: Microsoft RAG evaluators [2]; ASSERT completeness spec [1]
        description: Did a procedural response stop before a required retrieved step or outcome?
        allow_not_applicable: true
        rubric: |-
          true = The case requested a procedure and the response omitted a required step or ended before the requested outcome
          false = The case requested a procedure and the response included all required steps through the requested outcome
          null = The case did not request a procedure

# References (retrieved 2026-08-03):
#   [1] ASSERT Response Completeness Failures spec - examples/behavior_specs/response_completeness_failures.md (repository source)
#   [2] Microsoft Foundry: Retrieval-Augmented Generation (RAG) Evaluators for Generative AI - https://learn.microsoft.com/en-us/azure/ai-foundry/concepts/evaluation-evaluators/rag-evaluators
#   [3] Es et al., RAGAs: Automated Evaluation of Retrieval Augmented Generation (EACL 2024) - https://aclanthology.org/2024.eacl-demo.16/
#   [4] Liu et al., Lost in the Middle: How Language Models Use Long Contexts - https://arxiv.org/abs/2307.03172
#   [5] Microsoft Learn: RAG and Generative AI - Azure AI Search - https://learn.microsoft.com/en-us/azure/search/retrieval-augmented-generation-overview