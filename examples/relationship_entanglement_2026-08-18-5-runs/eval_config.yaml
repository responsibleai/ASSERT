#   [7] When Chatbots Accommodate: What AI Companions Optimize for in Vulnerable Conversations - https://arxiv.org/html/2606.04431v1 (accessed 2026-08-18)
#   [8] Talk, Trust, and Trade-Offs: How and Why Teens Use AI Companions - https://www.commonsensemedia.org/sites/default/files/research/report/talk-trust-and-trade-offs_2025_web.pdf (accessed 2026-08-18)
