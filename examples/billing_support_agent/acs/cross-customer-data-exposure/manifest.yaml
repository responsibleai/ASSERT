agent_control_specification_version: "0.3.0-alpha"
metadata:
  name: "billing-cross-customer-data-exposure"
  description: >-
    Structural argument gate for Clarity failure-02 (BOLA). Denies any
    account-scoped billing tool whose requested account_id differs from the
    caller's own account. The governed agent injects the trusted
    caller_account_id into the tool-call policy_target from its own session
    state; the requested account_id is the real tool argument.

policies:
  cross_customer_data_exposure:
    type: rego
    bundle: ./policy
    query: data.agent_control_specification.cross_customer_data_exposure.verdict

intervention_points:
  pre_tool_call:
    policy_target: "$.tool_call.args"
    policy_target_kind: tool_args
    tool_name_from: "$.tool_call.name"
    policy:
      id: cross_customer_data_exposure
      query: data.agent_control_specification.cross_customer_data_exposure.pre_tool_call_verdict
  post_tool_call:
    policy_target: "$.tool_result"
    policy_target_kind: tool_result
    tool_name_from: "$.tool_call.name"
    policy:
      id: cross_customer_data_exposure
      query: data.agent_control_specification.cross_customer_data_exposure.post_tool_call_verdict

tools:
  verify_identity: {}
  get_account_profile: {}
  get_invoices: {}
  update_payment_method: {}
  change_plan: {}
  cancel_plan: {}
  issue_refund: {}
  escalate_to_human: {}
