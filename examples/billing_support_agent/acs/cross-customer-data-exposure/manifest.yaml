agent_control_specification_version: 0.3.1-beta
metadata:
  name: billing_cross_customer_data_exposure
extends: []
policies:
  billing_cross_customer_data_exposure:
    type: rego
    bundle: ./policy
    query: data.agent_control_specification.billing_cross_customer_data_exposure.verdict
intervention_points:
  pre_tool_call:
    policy_target: $.tool_call.args
    policy_target_kind: tool_args
    policy:
      id: billing_cross_customer_data_exposure
      query: data.agent_control_specification.billing_cross_customer_data_exposure.pre_tool_call_verdict
    tool_name_from: $.tool_call.name
  post_tool_call:
    policy_target: $.tool_result
    policy_target_kind: tool_result
    policy:
      id: billing_cross_customer_data_exposure
      query: data.agent_control_specification.billing_cross_customer_data_exposure.post_tool_call_verdict
    tool_name_from: $.tool_call.name
# All eight tools are declared so a stacked/other control never fails closed with
# runtime_error:tool_unknown; the Rego `guarded_tools` set decides real denials.
tools:
  verify_identity:
    type: Tool
    id: verify_identity
  get_account_profile:
    type: Tool
    id: get_account_profile
  get_invoices:
    type: Tool
    id: get_invoices
  update_payment_method:
    type: Tool
    id: update_payment_method
  change_plan:
    type: Tool
    id: change_plan
  cancel_plan:
    type: Tool
    id: cancel_plan
  issue_refund:
    type: Tool
    id: issue_refund
  escalate_to_human:
    type: Tool
    id: escalate_to_human
