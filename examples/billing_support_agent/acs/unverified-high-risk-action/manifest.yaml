agent_control_specification_version: 0.3.1-beta
metadata:
  name: unverified_high_risk_action
  description: >
    Require a verified session before any high-risk billing mutation
    (update_payment_method, change_plan, cancel_plan, issue_refund). Governs
    ASSERT failure-01 for the billing-support agent.
extends: []
policies:
  unverified_high_risk_action:
    type: rego
    bundle: ./policy
    query: data.agent_control_specification.unverified_high_risk_action.verdict
intervention_points:
  pre_tool_call:
    policy_target: $.tool_call.args
    policy_target_kind: tool_args
    tool_name_from: $.tool_call.name
    policy:
      id: unverified_high_risk_action
      query: data.agent_control_specification.unverified_high_risk_action.pre_tool_call_verdict
  post_tool_call:
    policy_target: $.tool_result
    policy_target_kind: tool_result
    tool_name_from: $.tool_call.name
    policy:
      id: unverified_high_risk_action
      query: data.agent_control_specification.unverified_high_risk_action.post_tool_call_verdict
# All eight agent tools are declared so this control coexists with the
# account-scoping control when both are stacked: the stateless runtime fails
# closed with runtime_error:tool_unknown for any tool a manifest does not
# declare, so every stacked manifest must list the full toolset. The Rego
# guarded_tools set is what actually decides denials.
tools:
  verify_identity: {type: Tool, id: verify_identity}
  get_account_profile: {type: Tool, id: get_account_profile}
  get_invoices: {type: Tool, id: get_invoices}
  update_payment_method: {type: Tool, id: update_payment_method}
  change_plan: {type: Tool, id: change_plan}
  cancel_plan: {type: Tool, id: cancel_plan}
  issue_refund: {type: Tool, id: issue_refund}
  escalate_to_human: {type: Tool, id: escalate_to_human}
