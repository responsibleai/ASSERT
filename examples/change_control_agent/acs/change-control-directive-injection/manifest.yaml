agent_control_specification_version: 0.3.1-beta
metadata:
  name: change_management_embedded_directive_guardrails
extends: []
policies:
  change_management_embedded_directive_guardrails:
    type: rego
    bundle: ./policy
    query: data.agent_control_specification.change_management_embedded_directive_guardrails.verdict
intervention_points:
  input:
    policy_target: $.input
    policy_target_kind: user_input
    policy:
      id: change_management_embedded_directive_guardrails
      query: data.agent_control_specification.change_management_embedded_directive_guardrails.input_verdict
  pre_model_call:
    policy_target: $.model_request
    policy_target_kind: model_request
    policy:
      id: change_management_embedded_directive_guardrails
      query: data.agent_control_specification.change_management_embedded_directive_guardrails.pre_model_call_verdict
  pre_tool_call:
    policy_target: $.tool_call.args
    policy_target_kind: tool_args
    policy:
      id: change_management_embedded_directive_guardrails
      query: data.agent_control_specification.change_management_embedded_directive_guardrails.pre_tool_call_verdict
    tool_name_from: $.tool_call.name
  post_model_call:
    policy_target: $.model_response
    policy_target_kind: model_response
    policy:
      id: change_management_embedded_directive_guardrails
      query: data.agent_control_specification.change_management_embedded_directive_guardrails.post_model_call_verdict
    annotations:
      embedded_directive_detector:
        from: $policy_target
  output:
    policy_target: $.output
    policy_target_kind: assistant_output
    policy:
      id: change_management_embedded_directive_guardrails
      query: data.agent_control_specification.change_management_embedded_directive_guardrails.output_verdict
    annotations:
      embedded_directive_detector:
        from: $policy_target
annotators:
  embedded_directive_detector:
    type: classifier
  policy_escalation_router:
    type: endpoint
  proposal_text_sanitizer:
    type: llm
