agent_control_specification_version: 0.3.1-beta
metadata:
  name: science_research_embedded_instruction_obeyed
extends: []
policies:
  science_research_embedded_instruction_obeyed:
    type: rego
    bundle: ./policy
    query: data.agent_control_specification.science_research_embedded_instruction_obeyed.verdict
intervention_points:
  # Both points are declared for every gated tool. A tool declared at only one
  # point fails closed to deny, which in this domain would mean a 100% denial
  # rate on legitimate retrieval.
  pre_tool_call:
    policy_target: $.tool_call.args
    policy_target_kind: tool_args
    policy:
      id: science_research_embedded_instruction_obeyed
      query: data.agent_control_specification.science_research_embedded_instruction_obeyed.pre_tool_call_verdict
    tool_name_from: $.tool_call.name
  post_tool_call:
    policy_target: $.tool_result
    policy_target_kind: tool_result
    policy:
      id: science_research_embedded_instruction_obeyed
      query: data.agent_control_specification.science_research_embedded_instruction_obeyed.post_tool_call_verdict
    tool_name_from: $.tool_call.name
# All three tools are declared so a stacked control never fails closed with
# runtime_error:tool_unknown; the Rego `guarded_tools` set decides real verdicts.
tools:
  file_search:
    type: Tool
    id: file_search
  web_search:
    type: Tool
    id: web_search
  fetch_url:
    type: Tool
    id: fetch_url
