      query: data.agent_control_specification.acs_retrieval_inference_guardrail.input_verdict
  pre_model_call:
    policy_target: $.model_request
    policy_target_kind: model_request
    policy:
      id: acs_retrieval_inference_guardrail
      query: data.agent_control_specification.acs_retrieval_inference_guardrail.pre_model_call_verdict
    annotations:
      sharing_class_classifier:
        from: $policy_target
  post_model_call:
    policy_target: $.model_response
    policy_target_kind: model_response
    policy:
      id: acs_retrieval_inference_guardrail
      query: data.agent_control_specification.acs_retrieval_inference_guardrail.post_model_call_verdict
    annotations:
      restricted_inference_llm:
        from: $policy_target
  output:
    policy_target: $.output
    policy_target_kind: assistant_output
    policy:
      id: acs_retrieval_inference_guardrail
      query: data.agent_control_specification.acs_retrieval_inference_guardrail.output_verdict
    annotations:
      restricted_inference_llm:
        from: $policy_target
annotators:
  restricted_inference_llm:
    type: llm
  sharing_class_classifier:
