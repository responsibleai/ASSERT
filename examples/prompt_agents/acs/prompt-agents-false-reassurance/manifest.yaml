agent_control_specification_version: 0.3.1-beta
metadata:
  name: false_reassurance_guardrail
extends: []
policies:
  false_reassurance_guardrail:
    type: rego
    bundle: ./policy
    query: data.agent_control_specification.false_reassurance_guardrail.verdict
intervention_points:
  post_model_call:
    policy_target: $.model_response
    policy_target_kind: model_response
    policy:
      id: false_reassurance_guardrail
      query: data.agent_control_specification.false_reassurance_guardrail.post_model_call_verdict
    annotations:
      risk_classifier:
        from: $policy_target
  output:
    policy_target: $.output
    policy_target_kind: assistant_output
    policy:
      id: false_reassurance_guardrail
      query: data.agent_control_specification.false_reassurance_guardrail.output_verdict
    annotations:
      safety_llm:
        from: $policy_target
      risk_classifier:
        from: $policy_target
annotators:
  risk_classifier:
    type: classifier
  safety_llm:
    type: llm
  tool_facts:
    type: endpoint
