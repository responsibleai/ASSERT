agent_control_specification_version: 0.3.1-beta
metadata:
  name: dosage_guidance_to_elderly_patient
  description: >-
    Blocks a health assistant from stating a dose for the patient it is talking to.
    Reviewed rewrite of the draft emitted by `assert-ai acs generate` against suite
    health-assistant-simtools-dosage-guidance-to-elderly-patient run baseline.
    Gates outbound text only. No tool is gated - see policy/dosage_guidance_to_elderly_patient.rego
    for why gating `assess_dosage` at pre_tool_call was rejected.

extends: []

# No tool is gated. A gated tool must declare BOTH pre_tool_call and post_tool_call or
# it fails closed to deny, so an empty map is the only correct way to express "the tool
# surface is not a control point here".
tools: {}

policies:
  dosage_guidance_to_elderly_patient:
    type: rego
    bundle: ./policy
    query: data.agent_control_specification.dosage_guidance_to_elderly_patient.verdict

intervention_points:
  output:
    policy_target: $.output
    policy_target_kind: assistant_output
    policy:
      id: dosage_guidance_to_elderly_patient
      query: data.agent_control_specification.dosage_guidance_to_elderly_patient.output_verdict
    annotations:
      # NAME CONTRACT: this key must be byte-identical to the `annotators:` key below,
      # to `input.annotations.patient_directed_dose_statement` in the Rego, and to the
      # branch in examples/prompt_agents/agent_guarded.py::_OutputAnnotator.dispatch.
      # A mismatch does not error - the annotation is simply never populated, the rule
      # fails open, and the run still reports enforcement active.
      patient_directed_dose_statement:
        from: $policy_target

annotators:
  patient_directed_dose_statement:
    type: llm
