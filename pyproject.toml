[project]
name = "assert-ai"
version = "0.2.0"
description = "YAML-driven safety evaluation pipeline with LiteLLM-backed stages"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "ASSERT contributors" },
]
keywords = [
  "safety",
  "evaluation",
  "llm",
  "agent",
  "responsible-ai",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "click>=8.0",
  "litellm>=1.84.1,<2",
  "matplotlib>=3.10.8",
  "opentelemetry-api>=1.39.0",
  "opentelemetry-sdk>=1.39.0",
  "pydantic>=2.0",
  "python-dotenv>=1.2.2",
  "PyYAML>=6.0",
  "rapidfuzz>=3.9.0",
  "rich>=13.7.0",
]

[project.optional-dependencies]
otel = [
  # Phoenix 19.18.0-19.19.0 cannot import on supported Python 3.11: its
  # dataclass uses MappingProxyType values as mutable defaults. Keep the last
  # working release until upstream switches those fields to default_factory.
  "arize-phoenix>=15.0.0,<19.18.0",
  "arize-phoenix-otel>=0.15.0",
  "openinference-instrumentation-langchain>=0.1.62",
]
langgraph = [
  "langchain-core>=1.6.0",
  "langchain-openai>=1.1.14",
  "langgraph>=1.1.8",
]
dspy = [
  "dspy>=3.0.4,<4",
]
analysis = [
  "markdown-it-py>=3.0.0",
  "numpy>=2.0.0",
  "openai>=1.30.0",
  "openpyxl>=3.1.5",
  "pandas>=2.2.0",
  "requests>=2.33.0",
  "scikit-learn>=1.5.0",
  "seaborn>=0.13.0",
  "sentence-transformers>=3.0.0",
]
regression = [
  "scipy>=1.11.0",
  "numpy>=2.0.0",
]
# Optional Entra ID / Managed Identity auth for Azure OpenAI calls.
# Lets users on `az login`, system-assigned MI, or user-assigned MI skip
# `AZURE_API_KEY` entirely. Strictly additive: the base install keeps
# working with API keys exactly as before.
azure-aad = [
  "azure-identity>=1.19.0",
]
acs = [
  # Bridge ASSERT findings to Agent Governance Toolkit's ACS policy runtime.
  # `acs-generator` (pure Python) synthesizes the manifest + Rego from a
  # guardrail prompt; `agent-control-specification` is the native SDK used to
  # round-trip validate the generated policy and to wrap a guarded target.
  "acs-generator>=0.3.1b0",
  "agent-control-specification>=0.3.1b0",
]
examples = [
  "autogen-agentchat>=0.7.5",
  "autogen-ext>=0.7.5",
  "dspy>=3.0.4,<4",
  "haystack-ai>=2.28.0",
  "instructor>=1.15.1",
  "langchain-mcp-adapters>=0.2.2",
  "llama-index>=0.14.21",
  "llama-index-core>=0.14.21",
  "llama-index-llms-openai>=0.7.5",
  "openai-agents>=0.14.5",
  "pydantic-ai>=0.8.1",
  "smolagents>=1.22.0",
  # Framework-specific OpenInference instrumentors used by the
  # examples/phoenix_auto_trace/* demos. `assert_ai.auto_trace.enable()`
  # auto-loads every installed `openinference-instrumentation-*` package.
  "openinference-instrumentation-openai>=0.1.45",
  "openinference-instrumentation-litellm>=0.1.30",
  "openinference-instrumentation-dspy>=0.1.41",
  "openinference-instrumentation-crewai>=1.1.14",
]
all = [
  "assert-ai[otel,langgraph,analysis,examples,regression,azure-aad,acs]",
]
dev = [
  "pytest>=9.0.3",
  "pytest-timeout>=2.2.0",
]

[project.scripts]
assert-ai = "assert_ai.cli:cli"

[project.urls]
Homepage = "https://github.com/responsibleai/ASSERT"
Repository = "https://github.com/responsibleai/ASSERT"
Issues = "https://github.com/responsibleai/ASSERT/issues"
Documentation = "https://github.com/responsibleai/ASSERT#readme"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
"assert_ai.internal_pipeline_prompts" = ["*.md"]
"assert_ai.library.judges" = ["*.yaml", "*.md"]
"assert_ai.library.behaviors" = ["*.yaml", "*.md"]
"assert_ai.library.scenarios" = ["*.yaml", "*.md"]
"assert_ai.integrations.sandbox" = ["stock/Dockerfile"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "assert-ai[otel,langgraph,examples]",
]

[tool.setuptools.packages.find]
include = ["assert_ai*"]
